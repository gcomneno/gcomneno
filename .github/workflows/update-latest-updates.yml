name: Update generated profile data

on:
  workflow_dispatch:
  schedule:
    # 04:30 Europe/Rome (CET/CEST) ≈ 02:30 UTC in summer (CEST)
    - cron: "30 2 * * *"
  push:
    branches:
      - main
    paths:
      - scripts/profile_refresh_20260814.py
      - scripts/sync_selected_project_releases.py
      - scripts/update_latest_updates.py
      - tests/test_sync_selected_project_releases.py
      - tests/test_update_latest_updates.py
      - .github/workflows/update-latest-updates.yml

permissions:
  contents: write

jobs:
  update-generated-profile-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test profile generators
        run: python -m unittest discover -s tests -v

      - name: Apply approved curated profile refresh
        run: python scripts/profile_refresh_20260814.py

      - name: Sync Selected Projects releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_selected_project_releases.py

      - name: Update Latest Updates section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_latest_updates.py

      - name: Commit changes if needed
        run: |
          if git diff --quiet -- README.md README.it.md; then
            echo "No README updates found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md README.it.md
          git commit -m "docs: refresh curated profile"
          git push
