name: Update generated profile data

on:
  workflow_dispatch:
  schedule:
    # Four-hour GitHub-native refresh; no maintainer-local scheduler required.
    - cron: "17 */4 * * *"
  push:
    branches:
      - main
    paths:
      - scripts/sync_selected_project_releases.py
      - scripts/update_latest_updates.py
      - scripts/update_latest_updates_public_activity.py
      - tests/test_profile_curation.py
      - tests/test_sync_selected_project_releases.py
      - tests/test_update_latest_updates.py
      - tests/test_update_latest_updates_public_activity.py
      - .github/workflows/update-latest-updates.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/sync_selected_project_releases.py
      - scripts/update_latest_updates.py
      - scripts/update_latest_updates_public_activity.py
      - tests/test_profile_curation.py
      - tests/test_sync_selected_project_releases.py
      - tests/test_update_latest_updates.py
      - tests/test_update_latest_updates_public_activity.py
      - .github/workflows/update-latest-updates.yml

permissions:
  contents: write

jobs:
  update-generated-profile-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test profile generators and curation
        run: python -m unittest discover -s tests -v

      - name: Sync Selected Projects releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_selected_project_releases.py

      - name: Update Latest Updates section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_latest_updates_public_activity.py

      - name: Commit changes if needed
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- README.md README.it.md; then
            echo "No README updates found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md README.it.md
          git commit -m "chore: update generated profile data"
          git pull --rebase origin main
          git push
