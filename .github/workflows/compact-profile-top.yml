name: Compact profile introduction

on:
  push:
    paths:
      - .github/workflows/compact-profile-top.yml

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compact bilingual introduction
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          updates_pattern = re.compile(
              r"<!-- updates:start -->.*?<!-- updates:end -->",
              flags=re.DOTALL,
          )

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label}; found {count}")
              return text.replace(old, new, 1)

          english_old_top = '''<h1 align="center">Giancarlo Cicellyn Comneno</h1>

<p align="center">
  <strong>English</strong> · <a href="./README.it.md">Italiano</a>
</p>

<p align="center">
  <strong>Backend &amp; Tooling Software Developer · Python · Linux · CLI Automation · Open Source</strong>
</p>

<p align="center">
  <img alt="Backend — Tooling · Python — Systems and APIs · Linux — Automation · Open Source — Engineering" src="./assets/profile-badges.svg">
</p>

<p align="center">
  I build reliable backend systems, developer tools and operational automation with explicit boundaries, tests and reproducible workflows.
</p>

<p align="center">
  <em>Every problem solved once deserves to become knowledge.<br>
  If that knowledge is reusable, it deserves to become a tool.<br>
  If that tool is useful to others too, it deserves to become open source.</em><br>
  <img alt="Profile visitors" src="https://komarev.com/ghpvc/?username=gcomneno&label=%F0%9F%91%80&nbsp;&color=0B1F3A&style=flat-square">
</p>

<p align="center">
  <strong>GiadaWare™</strong> is my personal lab for turning recurring friction into notes, tools and public projects.
</p>

<p align="center">
  Earlier professional experience includes PHP and Laravel; my current public work focuses on Python, Linux, automation and open-source engineering. Open to remote roles and opportunities.
</p>
'''

          english_new_top = '''<h1 align="center">Giancarlo Cicellyn Comneno</h1>

<p align="center">
  <strong>English</strong> · <a href="./README.it.md">Italiano</a>
</p>

<p align="center">
  <strong>Backend &amp; Tooling Software Developer · Python · Linux · Automation · Open Source</strong>
</p>

<p align="center">
  <img alt="Backend — Tooling · Python — Systems and APIs · Linux — Automation · Open Source — Engineering" src="./assets/profile-badges.svg">
</p>

<p align="center">
  I turn recurring operational problems into reliable tools, explicit workflows and reusable open-source software.
</p>

<p align="center">
  <img alt="Profile visitors" src="https://komarev.com/ghpvc/?username=gcomneno&label=%F0%9F%91%80&nbsp;&color=0B1F3A&style=flat-square">
</p>
'''

          english_background = '''<details>
<summary>Background and GiadaWare</summary>

**GiadaWare™** is my personal lab for turning recurring friction into notes, tools and public projects.

Earlier professional experience includes PHP and Laravel; my current public work focuses on Python, Linux, automation and open-source engineering. Open to remote roles and opportunities.

> Every problem solved once deserves to become knowledge. If that knowledge is reusable, it deserves to become a tool. If that tool is useful to others too, it deserves to become open source.

</details>

'''

          italian_old_top = '''<h1 align="center">Giancarlo Cicellyn Comneno</h1>

<p align="center">
  <a href="./README.md">English</a> · <strong>Italiano</strong>
</p>

<p align="center">
  <strong>Sviluppatore software backend e tooling · Python · Linux · Automazione CLI · Open Source</strong>
</p>

<p align="center">
  <img alt="Backend — Tooling · Python — Sistemi e API · Linux — Automazione · Open Source — Engineering" src="./assets/profile-badges.svg">
</p>

<p align="center">
  Progetto sistemi backend affidabili, strumenti per sviluppatori e automazioni operative con confini espliciti, test e flussi riproducibili.
</p>

<p align="center">
  <em>Ogni problema risolto una volta merita di essere trasformato in conoscenza.<br>
  Se quella conoscenza è riutilizzabile, merita di diventare uno strumento.<br>
  Se lo strumento è utile anche ad altri, merita di diventare open source.</em><br>
  <img alt="Visitatori del profilo" src="https://komarev.com/ghpvc/?username=gcomneno&label=%F0%9F%91%80&nbsp;&color=0B1F3A&style=flat-square">
</p>

<p align="center">
  <strong>GiadaWare™</strong> è il mio laboratorio personale per trasformare gli attriti ricorrenti in appunti, strumenti e progetti pubblici.
</p>

<p align="center">
  La mia esperienza professionale precedente include PHP e Laravel; il lavoro pubblico attuale è concentrato su Python, Linux, automazione e ingegneria open source. Disponibile per ruoli da remoto e opportunità professionali.
</p>
'''

          italian_new_top = '''<h1 align="center">Giancarlo Cicellyn Comneno</h1>

<p align="center">
  <a href="./README.md">English</a> · <strong>Italiano</strong>
</p>

<p align="center">
  <strong>Sviluppatore software backend e tooling · Python · Linux · Automazione · Open Source</strong>
</p>

<p align="center">
  <img alt="Backend — Tooling · Python — Sistemi e API · Linux — Automazione · Open Source — Engineering" src="./assets/profile-badges.svg">
</p>

<p align="center">
  Trasformo problemi operativi ricorrenti in strumenti affidabili, flussi espliciti e software open source riutilizzabile.
</p>

<p align="center">
  <img alt="Visitatori del profilo" src="https://komarev.com/ghpvc/?username=gcomneno&label=%F0%9F%91%80&nbsp;&color=0B1F3A&style=flat-square">
</p>
'''

          italian_background = '''<details>
<summary>Esperienza e GiadaWare</summary>

**GiadaWare™** è il mio laboratorio personale per trasformare gli attriti ricorrenti in appunti, strumenti e progetti pubblici.

La mia esperienza professionale precedente include PHP e Laravel; il lavoro pubblico attuale è concentrato su Python, Linux, automazione e ingegneria open source. Disponibile per ruoli da remoto e opportunità professionali.

> Ogni problema risolto una volta merita di diventare conoscenza. Se quella conoscenza è riutilizzabile, merita di diventare uno strumento. Se lo strumento è utile anche ad altri, merita di diventare open source.

</details>

'''

          configs = [
              (
                  Path("README.md"),
                  english_old_top,
                  english_new_top,
                  "English top section",
                  "</details>\n\n## <code>02 · OPEN SOURCE ENGINEERING</code>",
                  "</details>\n\n" + english_background + "## <code>02 · OPEN SOURCE ENGINEERING</code>",
                  "English background insertion point",
              ),
              (
                  Path("README.it.md"),
                  italian_old_top,
                  italian_new_top,
                  "Italian top section",
                  "</details>\n\n## <code>02 · INGEGNERIA OPEN SOURCE</code>",
                  "</details>\n\n" + italian_background + "## <code>02 · INGEGNERIA OPEN SOURCE</code>",
                  "Italian background insertion point",
              ),
          ]

          for path, old_top, new_top, top_label, marker, replacement, marker_label in configs:
              original = path.read_text(encoding="utf-8")
              match = updates_pattern.search(original)
              if match is None:
                  raise SystemExit(f"Missing generated updates block in {path}")
              updates_block = match.group(0)

              revised = replace_once(original, old_top, new_top, top_label)
              revised = replace_once(revised, marker, replacement, marker_label)

              revised_match = updates_pattern.search(revised)
              if revised_match is None or revised_match.group(0) != updates_block:
                  raise SystemExit(f"Generated updates block changed in {path}")

              if revised.count("<summary>") != original.count("<summary>") + 1:
                  raise SystemExit(f"Unexpected details count in {path}")

              path.write_text(revised, encoding="utf-8")
          PY

          git diff --check

      - name: Commit compact introduction and remove workflow
        shell: bash
        run: |
          set -euo pipefail

          rm .github/workflows/compact-profile-top.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.it.md .github/workflows/compact-profile-top.yml
          git commit -m "docs: streamline profile introduction"
          git push origin HEAD:main
