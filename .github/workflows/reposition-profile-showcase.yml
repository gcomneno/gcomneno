      - name: Commit repositioned showcase
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.it.md assets/profile-badges.svg

          if git diff --cached --quiet; then
            echo "No profile repositioning changes required."
            exit 0
          fi

          git commit -m "docs: reposition profile around backend tooling"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Profile repositioning pushed successfully."
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Unable to push profile repositioning after three attempts." >&2
              exit 1
            fi

            sleep 2
          done
