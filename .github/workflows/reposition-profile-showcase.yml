          import re
          import textwrap

          english_path = Path("README.md")
          italian_path = Path("README.it.md")
          badge_path = Path("assets/profile-badges.svg")

          marker_pattern = re.compile(
              r"<!-- updates:start -->.*?<!-- updates:end -->",
              flags=re.DOTALL,
          )

          def extract_updates(path: Path) -> str:
              text = path.read_text(encoding="utf-8")
              match = marker_pattern.search(text)
              if match is None:
                  raise SystemExit(f"Missing generated updates block in {path}")
              if len(marker_pattern.findall(text)) != 1:
                  raise SystemExit(f"Unexpected number of updates blocks in {path}")
              return match.group(0)

          english_updates = extract_updates(english_path)
          italian_updates = extract_updates(italian_path)

          english = textwrap.dedent(f'''\
