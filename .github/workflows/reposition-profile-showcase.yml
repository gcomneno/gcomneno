name: Reposition profile showcase

on:
  push:
    paths:
      - .github/workflows/reposition-profile-showcase.yml

permissions:
  contents: write

jobs:
  reposition:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild bilingual profile showcase
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
