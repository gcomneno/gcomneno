          def validate(text: str, path: str, selected_heading: str, updates_heading: str) -> None:
              checks = {
                  "single updates block": len(marker_pattern.findall(text)) == 1,
                  "selected projects before updates": text.index(selected_heading) < text.index(updates_heading),
                  "single sponsor badge": text.count("github.com/sponsors/gcomneno") == 1,
                  "CYSE absent": "cyse-lab" not in text.lower(),
                  "obsolete hero absent": "Backend Software Developer · PHP/Laravel" not in text,
                  "current positioning present": "Python" in text and "Linux" in text and "Tooling" in text,
              }
              failed = [name for name, passed in checks.items() if not passed]
              if failed:
