name: Widen profile availability wording

on:
  push:
    paths:
      - .github/workflows/widen-profile-availability.yml

permissions:
  contents: write

jobs:
  update-wording:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update bilingual availability wording
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("README.md"): (
                  "Earlier professional experience includes PHP and Laravel; my current public work focuses on Python, Linux, automation and open-source engineering.<br>\n  <strong>Open to remote roles and opportunities in Tuscany.</strong>",
                  "Earlier professional experience includes PHP and Laravel; my current public work focuses on Python, Linux, automation and open-source engineering. Open to remote roles and opportunities.",
              ),
              Path("README.it.md"): (
                  "La mia esperienza professionale precedente include PHP e Laravel; il lavoro pubblico attuale è concentrato su Python, Linux, automazione e ingegneria open source.<br>\n  <strong>Disponibile per ruoli da remoto e opportunità in Toscana.</strong>",
                  "La mia esperienza professionale precedente include PHP e Laravel; il lavoro pubblico attuale è concentrato su Python, Linux, automazione e ingegneria open source. Disponibile per ruoli da remoto e opportunità professionali.",
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one target block in {path}")
              text = text.replace(old, new)
              if "opportunities in Tuscany" in text or "opportunità in Toscana" in text:
                  raise SystemExit(f"Territorial availability wording remains in {path}")
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit and push wording update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.it.md

          if git diff --cached --quiet; then
            echo "No wording changes required."
          else
            git commit -m "docs: widen profile opportunity availability"
            git push origin HEAD:main
          fi
