name: Reintegrate selected profile projects

on:
  push:
    paths:
      - .github/workflows/reintegrate-profile-projects.yml

permissions:
  contents: write

jobs:
  reintegrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bilingual curation
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          updates_re = re.compile(r"<!-- updates:start -->.*?<!-- updates:end -->", re.S)

          def sub_one(text, pattern, replacement, label):
              revised, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return revised

          def transform(path, italian=False):
              original = path.read_text(encoding="utf-8")
              updates = updates_re.search(original)
              if updates is None:
                  raise SystemExit(f"Missing updates block in {path}")
              frozen_updates = updates.group(0)
              text = original

              if not italian:
                  text = sub_one(
                      text,
                      re.escape("| [GiadaWare UI Components](https://github.com/gcomneno/giadaware-ui-components) | Svelte packaging, SSR and hydration behavior, accessibility and reusable presentation primitives |"),
                      "| [GiadaWare UI Components](https://github.com/gcomneno/giadaware-ui-components) | Svelte package architecture, immutable packed artifacts, isolated entry points, SSR/hydration and accessibility contracts |",
                      "English GiadaWare UI row",
                  )
                  text = sub_one(
                      text,
                      re.escape("| Sequence recognition | [OEIS Probe](https://github.com/gcomneno/oeis-probe) | Offline OEIS lookup, normalized search and SQLite caching |"),
                      "| Operational sequence analysis | [System Log Dynamics](https://github.com/gcomneno/system-log-dynamics) | Privacy-safe Linux journal normalization, deterministic classification, reproducible manifests and temporal comparison |\n| Sequence recognition | [OEIS Probe](https://github.com/gcomneno/oeis-probe) | Offline OEIS lookup, normalized search and SQLite caching |",
                      "English System Log Dynamics insertion",
                  )
                  text = sub_one(
                      text,
                      re.escape("| Software development | [Kleis Software Development Course](https://github.com/gcomneno/kleis-corso-sviluppo-software) | Progressive exercises in C#/.NET, HTML and SQL, with PHP planned for the course |"),
                      "| Embedded Linux | [Yocto/QEMU Mini Lab](https://github.com/gcomneno/yocto-qemu-mini-lab) | Reproducible image builds, custom layers and recipes, BitBake workflows and QEMU boot validation |\n| Software development | [Kleis Software Development Course](https://github.com/gcomneno/kleis-corso-sviluppo-software) | Progressive exercises in C#/.NET, HTML and SQL, with PHP planned for the course |",
                      "English Yocto insertion",
                  )
                  labs = """- [OOP in C Lab](https://github.com/gcomneno/oop-in-c-lab) — object layout, manual virtual dispatch, runtime type identity and checked downcasting
- [JavaScript Lab](https://github.com/gcomneno/js-lab-didattico) — JavaScript and TypeScript middleware pipelines and reusable design patterns, with executable tests
- [BoardLab](https://github.com/gcomneno/boardlab) — generic game-engine architecture and reproducible search/AI experiments in early incubation
- [Historical Laravel Lab](https://github.com/gcomneno/web) — earlier backend web study and documentation"""
                  text = sub_one(
                      text,
                      r"(<summary>Earlier or supporting learning labs</summary>\n\n).*?(\n\n</details>)",
                      lambda m: m.group(1) + labs + m.group(2),
                      "English supporting labs",
                  )
              else:
                  text = sub_one(
                      text,
                      re.escape("| [GiadaWare UI Components](https://github.com/gcomneno/giadaware-ui-components) | Pacchettizzazione Svelte, SSR e hydration, accessibilità e primitive di presentazione riutilizzabili |"),
                      "| [GiadaWare UI Components](https://github.com/gcomneno/giadaware-ui-components) | Architettura di package Svelte, artefatti immutabili pacchettizzati, entry point isolati e contratti SSR/hydration e accessibilità |",
                      "Italian GiadaWare UI row",
                  )
                  text = sub_one(
                      text,
                      re.escape("| Riconoscimento di sequenze | [OEIS Probe](https://github.com/gcomneno/oeis-probe) | Consultazione OEIS offline, ricerca normalizzata e cache SQLite |"),
                      "| Analisi di sequenze operative | [System Log Dynamics](https://github.com/gcomneno/system-log-dynamics) | Normalizzazione privacy-safe dei journal Linux, classificazione deterministica, manifest riproducibili e confronto temporale |\n| Riconoscimento di sequenze | [OEIS Probe](https://github.com/gcomneno/oeis-probe) | Consultazione OEIS offline, ricerca normalizzata e cache SQLite |",
                      "Italian System Log Dynamics insertion",
                  )
                  text = sub_one(
                      text,
                      re.escape("| Sviluppo software | [Corso Kleis di sviluppo software](https://github.com/gcomneno/kleis-corso-sviluppo-software) | Esercizi progressivi in C#/.NET, HTML e SQL, con PHP previsto dal corso |"),
                      "| Linux embedded | [Mini laboratorio Yocto/QEMU](https://github.com/gcomneno/yocto-qemu-mini-lab) | Build riproducibili di immagini, layer e recipe personalizzati, flussi BitBake e validazione del boot con QEMU |\n| Sviluppo software | [Corso Kleis di sviluppo software](https://github.com/gcomneno/kleis-corso-sviluppo-software) | Esercizi progressivi in C#/.NET, HTML e SQL, con PHP previsto dal corso |",
                      "Italian Yocto insertion",
                  )
                  labs = """- [Laboratorio OOP in C](https://github.com/gcomneno/oop-in-c-lab) — layout degli oggetti, dispatch virtuale manuale, identità di tipo a runtime e downcast controllato
- [Laboratorio JavaScript](https://github.com/gcomneno/js-lab-didattico) — pipeline middleware e pattern riutilizzabili in JavaScript e TypeScript, con test eseguibili
- [BoardLab](https://github.com/gcomneno/boardlab) — architettura generica per motori di gioco ed esperimenti riproducibili di ricerca e IA, ancora in incubazione iniziale
- [Laboratorio Laravel storico](https://github.com/gcomneno/web) — studio precedente del backend web e relativa documentazione"""
                  text = sub_one(
                      text,
                      r"(<summary>Laboratori precedenti o di supporto</summary>\n\n).*?(\n\n</details>)",
                      lambda m: m.group(1) + labs + m.group(2),
                      "Italian supporting labs",
                  )

              current_updates = updates_re.search(text)
              if current_updates is None or current_updates.group(0) != frozen_updates:
                  raise SystemExit(f"Updates block changed in {path}")
              path.write_text(text, encoding="utf-8")

          transform(Path("README.md"))
          transform(Path("README.it.md"), italian=True)
          PY

          rm -f \
            .github/workflows/reintegrate-profile-projects.yml \
            .github/workflows/fix-project-reintegration-validation.yml \
            .github/workflows/apply-profile-curation-v2.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.it.md .github/workflows
          git commit -m "docs: reintegrate aligned technical projects"
          git pull --rebase origin main
          git push origin HEAD:main
