name: Remove CYSE profile reference

on:
  push:
    paths:
      - .github/workflows/remove-cyse-profile-reference.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update bilingual profile READMEs
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          english = Path("README.md")
          italian = Path("README.it.md")

          wrong_url = "c592784d52688e63ccc372b596a808a48"
          correct_url = "c592784d52688dabbf87e63ccc372b596a808a48"

          english_text = english.read_text(encoding="utf-8")
          italian_text = italian.read_text(encoding="utf-8")

          if wrong_url not in english_text:
              raise SystemExit("Expected malformed English URL was not found")

          english_text = english_text.replace(wrong_url, correct_url, 1)

          def without_cyse_line(text: str, label: str) -> str:
              matches = [line for line in text.splitlines() if "github.com/gcomneno/cyse-lab" in line]
              if len(matches) > 1:
                  raise SystemExit(f"Unexpected multiple CYSE references in {label}: {len(matches)}")
              return "".join(
                  line
                  for line in text.splitlines(keepends=True)
                  if "github.com/gcomneno/cyse-lab" not in line
              )

          english_text = without_cyse_line(english_text, "README.md")
          italian_text = without_cyse_line(italian_text, "README.it.md")

          if "cyse-lab" in english_text.lower() or "cyse-lab" in italian_text.lower():
              raise SystemExit("CYSE reference still present after cleanup")
          if correct_url not in english_text:
              raise SystemExit("English historical update URL was not restored")

          english.write_text(english_text, encoding="utf-8")
          italian.write_text(italian_text, encoding="utf-8")
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.it.md

          if git diff --cached --quiet; then
            echo "No profile cleanup changes required."
            exit 0
          fi

          git commit -m "docs: align bilingual profile showcase"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Profile cleanup pushed successfully."
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Unable to push profile cleanup after three attempts." >&2
              exit 1
            fi

            sleep 2
          done
