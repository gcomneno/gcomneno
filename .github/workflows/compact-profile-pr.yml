name: Apply compact profile introduction

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  compact:
    if: github.event.pull_request.title == 'Trigger compact profile introduction 2026-08-05'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compact bilingual profile introduction
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          updates_pattern = re.compile(
              r"<!-- updates:start -->.*?<!-- updates:end -->",
              flags=re.DOTALL,
          )

          configs = [
              {
                  "path": Path("README.md"),
                  "heading": "## <code>01 · SELECTED PROJECTS</code>",
                  "next_heading": "## <code>02 · OPEN SOURCE ENGINEERING</code>",
                  "top": '''<h1 align="center">Giancarlo Cicellyn Comneno</h1>

<p align="center">
  <strong>English</strong> · <a href="./README.it.md">Italiano</a>
</p>

<p align="center">
  <strong>Backend &amp; Tooling Software Developer · Python · Linux · Automation · Open Source</strong>
</p>

<p align="center">
  <img alt="Backend — Tooling · Python — Systems and APIs · Linux — Automation · Open Source — Engineering" src="./assets/profile-badges.svg">
</p>

<p align="center">
  I turn recurring operational problems into reliable tools, explicit workflows and reusable open-source software.
</p>

<p align="center">
  <img alt="Profile visitors" src="https://komarev.com/ghpvc/?username=gcomneno&label=%F0%9F%91%80&nbsp;&color=0B1F3A&style=flat-square">
</p>

''',
                  "background": '''<details>
<summary>Background and GiadaWare</summary>

**GiadaWare™** is my personal lab for turning recurring friction into notes, tools and public projects.

Earlier professional experience includes PHP and Laravel; my current public work focuses on Python, Linux, automation and open-source engineering. Open to remote roles and opportunities.

> Every problem solved once deserves to become knowledge. If that knowledge is reusable, it deserves to become a tool. If that tool is useful to others too, it deserves to become open source.

</details>

''',
                  "summary": "<summary>Background and GiadaWare</summary>",
              },
              {
                  "path": Path("README.it.md"),
                  "heading": "## <code>01 · PROGETTI SELEZIONATI</code>",
                  "next_heading": "## <code>02 · INGEGNERIA OPEN SOURCE</code>",
                  "top": '''<h1 align="center">Giancarlo Cicellyn Comneno</h1>

<p align="center">
  <a href="./README.md">English</a> · <strong>Italiano</strong>
</p>

<p align="center">
  <strong>Sviluppatore software backend e tooling · Python · Linux · Automazione · Open Source</strong>
</p>

<p align="center">
  <img alt="Backend — Tooling · Python — Sistemi e API · Linux — Automazione · Open Source — Engineering" src="./assets/profile-badges.svg">
</p>

<p align="center">
  Trasformo problemi operativi ricorrenti in strumenti affidabili, flussi espliciti e software open source riutilizzabile.
</p>

<p align="center">
  <img alt="Visitatori del profilo" src="https://komarev.com/ghpvc/?username=gcomneno&label=%F0%9F%91%80&nbsp;&color=0B1F3A&style=flat-square">
</p>

''',
                  "background": '''<details>
<summary>Esperienza e GiadaWare</summary>

**GiadaWare™** è il mio laboratorio personale per trasformare gli attriti ricorrenti in appunti, strumenti e progetti pubblici.

La mia esperienza professionale precedente include PHP e Laravel; il lavoro pubblico attuale è concentrato su Python, Linux, automazione e ingegneria open source. Disponibile per ruoli da remoto e opportunità professionali.

> Ogni problema risolto una volta merita di diventare conoscenza. Se quella conoscenza è riutilizzabile, merita di diventare uno strumento. Se lo strumento è utile anche ad altri, merita di diventare open source.

</details>

''',
                  "summary": "<summary>Esperienza e GiadaWare</summary>",
              },
          ]

          for config in configs:
              path = config["path"]
              original = path.read_text(encoding="utf-8")
              generated = updates_pattern.search(original)
              if generated is None:
                  raise SystemExit(f"Missing updates block in {path}")
              updates_block = generated.group(0)

              heading_index = original.find(config["heading"])
              if heading_index < 0:
                  raise SystemExit(f"Missing first curated heading in {path}")

              revised = config["top"] + original[heading_index:]
              if config["summary"] in revised:
                  raise SystemExit(f"Background panel already present in {path}")

              marker = "</details>\n\n" + config["next_heading"]
              if revised.count(marker) != 1:
                  raise SystemExit(
                      f"Expected one background insertion marker in {path}; "
                      f"found {revised.count(marker)}"
                  )

              revised = revised.replace(
                  marker,
                  "</details>\n\n" + config["background"] + config["next_heading"],
                  1,
              )

              revised_generated = updates_pattern.search(revised)
              if revised_generated is None or revised_generated.group(0) != updates_block:
                  raise SystemExit(f"Generated updates block changed in {path}")

              path.write_text(revised, encoding="utf-8")
          PY

          rm -f \
            .github/workflows/compact-profile-top.yml \
            .github/workflows/compact-profile-trigger.yml \
            .github/workflows/compact-profile-pr.yml

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.it.md .github/workflows
          git commit -m "docs: streamline profile introduction"
          git push origin HEAD:main

      - name: Remove trigger branch
        shell: bash
        run: |
          git push origin --delete profile-top-trigger || true
